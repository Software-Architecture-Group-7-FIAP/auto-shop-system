<p class="detail-title-text">Novo veículo</p>
<app-form-error-alert [title]="errorTitle" [message]="errorMessage"></app-form-error-alert>
<form #formRef="ngForm" (ngSubmit)="saveVehicle(formRef.value)" (input)="clearError()">
  <div class="field-list">
    <div class="field-name" *ngIf="!customerId">
      <span>ID do cliente</span>
      <input
        class="text-input small-input"
        type="number"
        name="customer_id"
        ngModel
        required
        min="1"
      />
    </div>
    <div class="field-name">
      <span>Placa</span>
      <input
        class="text-input medium-input"
        type="text"
        name="plate"
        ngModel
        required
        placeholder="ABC1D23"
      />
    </div>
    <div class="field-name">
      <span>UF</span>
      <input
        class="text-input small-input"
        type="text"
        name="state"
        ngModel
        required
        minlength="2"
        maxlength="2"
        placeholder="SP"
        style="text-transform: uppercase"
      />
    </div>
    <div class="field-name">
      <span>Cidade</span>
      <input
        class="text-input medium-input"
        type="text"
        name="city"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Marca</span>
      <input
        class="text-input medium-input"
        type="text"
        name="brand"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Modelo</span>
      <input
        class="text-input medium-input"
        type="text"
        name="model"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Cor</span>
      <input
        class="text-input medium-input"
        type="text"
        name="color"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Ano</span>
      <input
        class="text-input small-input"
        type="number"
        name="year"
        ngModel
        required
        min="1900"
        max="2100"
      />
    </div>
  </div>
  <div class="button-list">
    <button class="btn btn-primary" type="submit" [disabled]="formRef.invalid">
      Salvar
    </button>
    <button
      *ngIf="customerId"
      class="btn btn-secondary"
      type="button"
      (click)="cancel()"
    >
      Cancelar
    </button>
  </div>
</form>
