<p class="detail-title-text">Novo veículo</p>
<form #formRef="ngForm" (ngSubmit)="saveVehicle(formRef.value)">
  <div class="field-list">
    <div class="field-name">
      <span>ID do cliente</span>
      <input
        class="text-input small-input"
        type="number"
        name="customer_id"
        ngModel
        required
        min="1"
      />
    </div>
    <div class="field-name">
      <span>Placa</span>
      <input
        class="text-input medium-input"
        type="text"
        name="plate"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Marca</span>
      <input
        class="text-input medium-input"
        type="text"
        name="brand"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Modelo</span>
      <input
        class="text-input medium-input"
        type="text"
        name="model"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Ano</span>
      <input
        class="text-input small-input"
        type="number"
        name="year"
        ngModel
        required
        min="1900"
        max="2100"
      />
    </div>
  </div>
  <div class="button-list">
    <button class="btn btn-primary" type="submit" [disabled]="formRef.invalid">
      Salvar
    </button>
  </div>
</form>
