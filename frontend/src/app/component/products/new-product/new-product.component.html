<p class="detail-title-text">Novo produto</p>
<form #formRef="ngForm" (ngSubmit)="saveProduct(formRef.value)">
  <div class="field-list">
    <div class="field-name">
      <span>Nome</span>
      <input
        class="text-input big-input"
        type="text"
        name="name"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>SKU</span>
      <input
        class="text-input medium-input"
        type="text"
        name="sku"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Preço unitário</span>
      <input
        class="text-input medium-input"
        type="number"
        name="unit_price"
        ngModel
        required
        min="0.01"
        step="0.01"
      />
    </div>
    <div class="field-name">
      <span>Quantidade em estoque</span>
      <input
        class="text-input small-input"
        type="number"
        name="stock_quantity"
        ngModel
        value="0"
        min="0"
      />
    </div>
    <div class="field-name">
      <span>Descrição</span>
      <input
        class="text-input big-input"
        type="text"
        name="description"
        ngModel
      />
    </div>
    <div class="field-name">
      <span>ID do fornecedor</span>
      <input
        class="text-input small-input"
        type="number"
        name="supplier_id"
        ngModel
        min="1"
      />
    </div>
  </div>
  <div class="button-list">
    <button class="btn btn-primary" type="submit" [disabled]="formRef.invalid">
      Salvar
    </button>
  </div>
</form>
