<div class="wrapper">
  <div class="navigation-block">
    <app-head-navigation
      [titleText]="'Ordens de Serviço'"
      [toCreatingMode]="toCreatingMode"
      [showAdd]="false"
    ></app-head-navigation>
  </div>
  <div class="model-list-block scrollbar">
    <div class="filter-bar">
      <label>
        Status
        <select class="select-input" [(ngModel)]="selectedStatus" [ngModelOptions]="{ standalone: true }">
          <option value="">Todos</option>
          <option *ngFor="let status of statusValues" [ngValue]="status">{{ status }}</option>
        </select>
      </label>
      <button class="btn btn-secondary" type="button" (click)="applyStatusFilter()" [disabled]="isLoading">
        Filtrar
      </button>
      <button class="btn btn-secondary" type="button" (click)="loadServiceOrders()" [disabled]="isLoading">
        Atualizar
      </button>
    </div>
    <ul class="model-list">
      <li class="list-header">
        <span class="col-1">ID</span>
        <span class="col-2">Status</span>
        <span class="col-3">Prioridade</span>
        <span class="col-4">Mecânico</span>
      </li>
      <li
        *ngFor="let order of serviceOrders"
        class="list-item"
        (click)="selectServiceOrder(order.id)"
        [class.selected]="order.id === selectedServiceOrderId"
      >
        <span class="col-1">{{ order.id }}</span>
        <span class="col-2"><span class="badge badge-status">{{ order.status }}</span></span>
        <span class="col-3"><span class="badge badge-priority">{{ order.priority }}</span></span>
        <span class="col-4">{{ order.mechanic_name || '—' }}</span>
      </li>
    </ul>
    <span *ngIf="!isLoading && serviceOrders.length === 0" class="empty-list-message">
      Nenhuma ordem de serviço encontrada.
    </span>
  </div>
  <div class="model-detail-block scrollbar">
    <span *ngIf="!selectedServiceOrderId" class="model-detail-message">
      Nenhuma ordem de serviço selecionada.
    </span>
    <app-service-order-detail
      *ngIf="selectedServiceOrderId"
      [serviceOrderId]="selectedServiceOrderId"
    ></app-service-order-detail>
  </div>
</div>
