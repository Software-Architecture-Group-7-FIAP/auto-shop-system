<div class="login-page">
  <div class="login-card">
    <h1>Oficina Mecânica</h1>
    <p>Acesse o painel administrativo</p>
    <form #loginForm="ngForm" (ngSubmit)="login(loginForm.value)">
      <div class="field-list">
        <div class="field-name">
          <span>Usuário</span>
          <input
            class="text-input big-input"
            type="text"
            name="username"
            ngModel
            required
          />
        </div>
        <div class="field-name">
          <span>Senha</span>
          <input
            class="text-input big-input"
            type="password"
            name="password"
            ngModel
            required
          />
        </div>
      </div>
      <div class="button-list">
        <button class="btn btn-primary" type="submit" [disabled]="loginForm.invalid">
          Entrar
        </button>
      </div>
    </form>
    <a routerLink="/track-service-order" class="tracking-shortcut">
      Acompanhar ordem de serviço
    </a>
  </div>
</div>
