<p class="detail-title-text">Novo fornecedor</p>
<form #formRef="ngForm" (ngSubmit)="saveSupplier(formRef.value)">
  <div class="field-list">
    <div class="field-name">
      <span>Nome</span>
      <input
        class="text-input big-input"
        type="text"
        name="name"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Documento</span>
      <input
        class="text-input medium-input"
        type="text"
        name="document"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>E-mail</span>
      <input
        class="text-input big-input"
        type="email"
        name="email"
        ngModel
        required
      />
    </div>
    <div class="field-name">
      <span>Telefone</span>
      <input
        class="text-input medium-input"
        type="text"
        name="phone"
        ngModel
      />
    </div>
  </div>
  <div class="button-list">
    <button class="btn btn-primary" type="submit" [disabled]="formRef.invalid">
      Salvar
    </button>
  </div>
</form>
