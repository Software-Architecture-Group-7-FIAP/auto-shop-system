services:
  db:
    image: postgres:16-alpine
    container_name: auto_shop_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong local database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: auto_shop_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    image: auto-shop-system:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto_shop_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong local database password}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a strong random value}
      APP_ENV: development
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@oficina.local
      APP_BASE_URL: http://localhost:8000
      FRONTEND_PUBLIC_URL: http://localhost:4200
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Authorization,Content-Type
      SECURITY_HSTS_ENABLED: "false"
      SMTP_USE_TLS: "false"
      SMTP_STARTTLS: "false"
      SMTP_REQUIRE_TLS: "false"
      AUTO_CREATE_SCHEMA: "false"
      SKIP_CPF_EXTERNAL_VALIDATION: "true"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  postgres_data:
