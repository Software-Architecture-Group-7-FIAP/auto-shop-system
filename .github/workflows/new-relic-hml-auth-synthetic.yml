name: New Relic HML authentication synthetic
run-name: new-relic:hml-auth:${{ inputs.session_id }}:${{ inputs.lifecycle_dispatch_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Coordinator-provided HML session ID
        required: true
        type: string
      started_at:
        description: Coordinator-provided UTC session start, YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string
      session_mode:
        description: Authorized HML window
        required: true
        type: choice
        options: [hml]
      session_token:
        description: Signed coordinator session capability
        required: false
        type: string
      lifecycle_dispatch_id:
        description: Coordinator-generated run correlation ID
        required: false
        type: string
      confirm_privacy_contract:
        description: Confirm lambda-auth payload capture is disabled and send exactly one HML request
        required: true
        type: boolean
        default: false
      confirm_synthetic_identity:
        description: Confirm the HML secret identifies a dedicated non-person test customer
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: new-relic-hml-auth-synthetic
  cancel-in-progress: false

jobs:
  synthetic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.confirm_privacy_contract == true && inputs.confirm_synthetic_identity == true
    runs-on: ubuntu-latest
    environment: hml
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate coordinator inputs and HML session gates
        env:
          SOURCE_REF: ${{ github.ref }}
          SESSION_ID: ${{ inputs.session_id }}
          STARTED_AT: ${{ inputs.started_at }}
          SESSION_MODE: ${{ inputs.session_mode }}
          LIFECYCLE_SESSION_TOKEN: ${{ inputs.session_token }}
          LIFECYCLE_SESSION_SIGNING_KEY: ${{ secrets.LIFECYCLE_SESSION_SIGNING_KEY }}
          STAGING_ACTIVE: ${{ vars.STAGING_ACTIVE || 'false' }}
          STAGING_SESSION_AUTHORIZED: ${{ vars.STAGING_SESSION_AUTHORIZED || 'false' }}
          STAGING_SESSION_ALLOW_ANY_TIME: ${{ vars.STAGING_SESSION_ALLOW_ANY_TIME || 'false' }}
          AUTHORIZED_SESSION_MODE: ${{ vars.STAGING_SESSION_MODE || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "refs/heads/develop" ]]
          [[ "$STAGING_ACTIVE" == "true" && "$STAGING_SESSION_AUTHORIZED" == "true" ]]
          [[ "$AUTHORIZED_SESSION_MODE" == "hml" && "$SESSION_MODE" == "hml" ]]
          ENVIRONMENT_ACTIVE="$STAGING_ACTIVE" \
            ENVIRONMENT_WINDOW_AUTHORIZED="$STAGING_SESSION_AUTHORIZED" \
            ENVIRONMENT_SESSION_ID="$SESSION_ID" \
            ENVIRONMENT_WINDOW_STARTED_AT="$STARTED_AT" \
            ENVIRONMENT_STAGE=hml \
            SESSION_MODE="$SESSION_MODE" \
            python3 .github/scripts/validate_environment_window.py --action operate

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Send one bounded authentication request
        env:
          HML_SYNTHETIC_CUSTOMER_CPF: ${{ secrets.HML_SYNTHETIC_CUSTOMER_CPF }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(python3 scripts/observability/synthetic_auth.py)"
          unset HML_SYNTHETIC_CUSTOMER_CPF
          {
            echo "### HML authentication synthetic"
            echo '```json'
            printf '%s\n' "$result"
            echo '```'
            echo "The response body and issued JWT were discarded. Correlate only within this run's bounded UTC window."
          } >> "$GITHUB_STEP_SUMMARY"
