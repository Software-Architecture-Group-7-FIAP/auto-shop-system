name: Reusable build and push

on:
  workflow_call:
    outputs:
      image_reference:
        description: Lowercase GHCR reference with sha-* tag
        value: ${{ jobs.build-push.outputs.image_reference }}
      image_tag:
        description: Immutable tag (sha-<short>)
        value: ${{ jobs.build-push.outputs.image_tag }}

permissions: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_reference: ${{ steps.meta.outputs.image_reference }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          tag="sha-${short}"
          repo="${GITHUB_REPOSITORY,,}"
          reference="ghcr.io/${repo}:${tag}"
          echo "image_reference=${reference}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_reference }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish image reference
        run: echo "Pushed ${{ steps.meta.outputs.image_reference }}"

  verify-anonymous-pull:
    needs: build-push
    runs-on: ubuntu-latest
    permissions: {}
    env:
      IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
    steps:
      - name: Verify image is pullable without credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${IMAGE_REFERENCE}" != ghcr.io/*:sha-* ]]; then
            echo "Expected an immutable sha-tagged GHCR image reference." >&2
            exit 1
          fi
          docker pull "${IMAGE_REFERENCE}"
