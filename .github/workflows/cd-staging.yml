name: CD Staging

# Deploy automático para staging — implementação completa na issue #90.
# Este workflow existe para manter a estrutura acordada na #89 sem acoplar repos.

on:
  workflow_dispatch:
    inputs:
      image_reference:
        description: "Imagem imutável (ex.: ghcr.io/org/auto-shop-system:sha-a1b2c3d)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder — deploy staging (#90)
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
        run: |
          set -euo pipefail
          pattern='^[a-zA-Z0-9]+([._-][a-zA-Z0-9]+)*(:[0-9]+)?(/[a-zA-Z0-9]+([._-][a-zA-Z0-9]+)*)+(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[a-f0-9]{64})$'
          if [[ ! "$IMAGE_REFERENCE" =~ $pattern ]]; then
            echo "Invalid image reference. Expected registry/repository:tag or registry/repository@sha256:<64 hex>."
            exit 1
          fi
          echo "CD staging será implementado na issue #90 (build/push, OIDC, smoke test)."
          echo "Imagem informada: ${IMAGE_REFERENCE}"
