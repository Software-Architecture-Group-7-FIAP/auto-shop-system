name: CD Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    uses: ./.github/workflows/reusable-build-push.yml
    secrets: inherit

  deploy-staging:
    needs: build-push
    if: vars.DEPLOY_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Connect to EKS
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${EKS_CLUSTER_NAME}" || -z "${AWS_REGION}" ]]; then
            echo "Environment staging requires EKS_CLUSTER_NAME and AWS_REGION."
            exit 1
          fi
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Deploy to staging
        run: ./k8s/scripts/deploy.sh staging "${IMAGE_REFERENCE}"

  deploy-staging-skipped:
    needs: build-push
    if: vars.DEPLOY_STAGING_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gated until staging infra (#87)
        env:
          IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
        run: |
          echo "Imagem publicada: ${IMAGE_REFERENCE}"
          echo "Deploy staging ignorado: defina a variável de repositório DEPLOY_STAGING_ENABLED=true."
          echo "No Environment staging: EKS_CLUSTER_NAME, AWS_REGION e o secret AWS_DEPLOY_ROLE_ARN."
          echo "Ver .github/CD.md"
