name: CD Staging
run-name: lifecycle:${{ inputs.session_id || format('push-{0}', github.run_id) }}:app-deploy:${{ inputs.lifecycle_dispatch_id || github.run_id }}

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      session_id:
        description: Coordinator-provided HML session ID
        required: true
        type: string
      started_at:
        description: Coordinator-provided UTC session start, YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string
      session_mode:
        description: Coordinator-authorized HML session
        required: true
        type: choice
        options: [hml]
      session_token:
        description: Signed coordinator session capability; validation fails if missing.
        required: false
        type: string
      lifecycle_dispatch_id:
        description: Optional coordinator correlation ID.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle-authorization:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - name: Require develop as the HML source branch
        env:
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "refs/heads/develop" ]] || {
            echo "::error::HML deployments must run from develop."
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate coordinator inputs and static HML gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SESSION_ID: ${{ inputs.session_id }}
          REQUESTED_STARTED_AT: ${{ inputs.started_at }}
          REQUESTED_SESSION_MODE: ${{ inputs.session_mode }}
          SESSION_MODE: ${{ inputs.session_mode }}
          LIFECYCLE_SESSION_TOKEN: ${{ inputs.session_token }}
          LIFECYCLE_SESSION_SIGNING_KEY: ${{ secrets.LIFECYCLE_SESSION_SIGNING_KEY }}
          STAGING_ACTIVE: ${{ vars.STAGING_ACTIVE || 'false' }}
          STAGING_SESSION_AUTHORIZED: ${{ vars.STAGING_SESSION_AUTHORIZED || 'false' }}
          AUTHORIZED_SESSION_MODE: ${{ vars.STAGING_SESSION_MODE || '' }}
          DEPLOY_STAGING_ENABLED: ${{ vars.DEPLOY_STAGING_ENABLED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_STAGING_ENABLED" == "true" ]] || {
            echo "::error::DEPLOY_STAGING_ENABLED is not true."
            exit 1
          }
          [[ "$STAGING_ACTIVE" == "true" && "$STAGING_SESSION_AUTHORIZED" == "true" && "$AUTHORIZED_SESSION_MODE" == "hml" ]] || {
            echo "::error::HML static authorization gates are not enabled."
            exit 1
          }
          [[ "$REQUESTED_SESSION_MODE" == "hml" ]] || { echo "::error::session_mode must be hml."; exit 1; }
          ENVIRONMENT_ACTIVE="$STAGING_ACTIVE" \
            ENVIRONMENT_WINDOW_AUTHORIZED="$STAGING_SESSION_AUTHORIZED" \
            ENVIRONMENT_SESSION_ID="$REQUESTED_SESSION_ID" \
            ENVIRONMENT_WINDOW_STARTED_AT="$REQUESTED_STARTED_AT" \
            SESSION_MODE="$REQUESTED_SESSION_MODE" \
            ENVIRONMENT_STAGE=hml \
            python3 .github/scripts/validate_environment_window.py --action deploy

  build-push:
    needs: lifecycle-authorization
    if: always() && (github.event_name == 'push' || needs.lifecycle-authorization.result == 'success')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-push.yml
    secrets: inherit

  deploy-staging:
    needs: [build-push, lifecycle-authorization]
    if: >-
      always() && needs.build-push.result == 'success' &&
      (github.event_name == 'push' || needs.lifecycle-authorization.result == 'success') &&
      github.ref == 'refs/heads/develop' && vars.DEPLOY_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: hml
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require HML deployment authorization
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_STAGING_ENABLED: ${{ vars.DEPLOY_STAGING_ENABLED || 'false' }}
          STAGING_ACTIVE: ${{ vars.STAGING_ACTIVE || 'false' }}
          STAGING_SESSION_AUTHORIZED: ${{ vars.STAGING_SESSION_AUTHORIZED || 'false' }}
          AUTHORIZED_SESSION_MODE: ${{ vars.STAGING_SESSION_MODE || '' }}
          ENVIRONMENT_SESSION_ID: ${{ inputs.session_id }}
          ENVIRONMENT_WINDOW_STARTED_AT: ${{ inputs.started_at }}
          SESSION_MODE: ${{ inputs.session_mode }}
          LIFECYCLE_SESSION_TOKEN: ${{ inputs.session_token }}
          LIFECYCLE_SESSION_SIGNING_KEY: ${{ secrets.LIFECYCLE_SESSION_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_STAGING_ENABLED" == "true" ]] || { echo "::error::DEPLOY_STAGING_ENABLED is not true."; exit 1; }
          [[ "$STAGING_ACTIVE" == "true" && "$STAGING_SESSION_AUTHORIZED" == "true" && "$AUTHORIZED_SESSION_MODE" == "hml" ]] || {
            echo "::error::HML static authorization gates are not enabled."
            exit 1
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$SESSION_MODE" == "hml" ]] || { echo "::error::session_mode must be hml."; exit 1; }
            ENVIRONMENT_ACTIVE="$STAGING_ACTIVE" \
              ENVIRONMENT_WINDOW_AUTHORIZED="$STAGING_SESSION_AUTHORIZED" \
              ENVIRONMENT_SESSION_ID="$ENVIRONMENT_SESSION_ID" \
              ENVIRONMENT_WINDOW_STARTED_AT="$ENVIRONMENT_WINDOW_STARTED_AT" \
              ENVIRONMENT_STAGE=hml \
              python3 .github/scripts/validate_environment_window.py --action deploy
          fi

      - name: Authenticate with GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify image is pullable
        run: docker pull "${IMAGE_REFERENCE}"

      - name: Validate the Terraform-managed HML deploy role ARN
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_HML || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ROLE_ARN" == "arn:aws:iam::035611741563:role/auto-shop-staging-github-staging" ]] || {
            echo "::error::Set AWS_DEPLOY_ROLE_ARN_HML to Terraform output github_deploy_role_arn_staging before HML deployment."
            exit 1
          }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_HML }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.1

      - name: Resolve EKS cluster name from SSM
        id: eks
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SSM_PARAMETER_PREFIX: /auto-shop/staging
        run: |
          set -euo pipefail
          if [[ -z "${AWS_REGION}" ]]; then
            echo "Environment staging requires AWS_REGION."
            exit 1
          fi
          cluster_name="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/eks/cluster-name" \
            --query 'Parameter.Value' --output text)"
          # Attempt to get migration parameter; if missing, create it with RDS secret
          if migration_secret_arn="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/database/secrets/migrations-hml-arn" \
            --query 'Parameter.Value' --output text 2>&1)"; then
            :
          else
            echo "⚠ Migration parameter not found; creating from RDS secret..."
            RDS_SECRET_ARN="arn:aws:secretsmanager:${AWS_REGION}:$(aws sts get-caller-identity --query Account --output text):secret:rds!db-cbe0cdd5-5c60-4a11-ba48-d0b4d18c4de2"
            aws ssm put-parameter \
              --name "${SSM_PARAMETER_PREFIX}/database/secrets/migrations-hml-arn" \
              --value "${RDS_SECRET_ARN}" \
              --type String \
              --overwrite 2>/dev/null || true
            migration_secret_arn="${RDS_SECRET_ARN}"
          fi
          # Attempt to get service-order event bus parameter; if missing, create default
          if service_order_event_bus_name="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/events/service-order-bus-name" \
            --query 'Parameter.Value' --output text 2>&1)"; then
            :
          else
            echo "⚠ Service order event bus parameter not found; using default..."
            service_order_event_bus_name="auto-shop-service-orders"
            aws ssm put-parameter \
              --name "${SSM_PARAMETER_PREFIX}/events/service-order-bus-name" \
              --value "${service_order_event_bus_name}" \
              --type String \
              --overwrite 2>/dev/null || true
          fi
          # Attempt to get service-order publisher role parameter; if missing, create default
          if service_order_publisher_role_arn="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/events/service-order-publisher-role-arn/hml" \
            --query 'Parameter.Value' --output text 2>&1)"; then
            :
          else
            echo "⚠ Service order publisher role parameter not found; using default..."
            ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            service_order_publisher_role_arn="arn:aws:iam::${ACCOUNT_ID}:role/auto-shop-service-order-publisher-hml"
            aws ssm put-parameter \
              --name "${SSM_PARAMETER_PREFIX}/events/service-order-publisher-role-arn/hml" \
              --value "${service_order_publisher_role_arn}" \
              --type String \
              --overwrite 2>/dev/null || true
          fi
          if [[ ! "${cluster_name}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$ ]]; then
            echo "The EKS cluster name in SSM is invalid." >&2
            exit 1
          fi
          if [[ ! "${migration_secret_arn}" =~ ^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$ ]]; then
            echo "The migration secret ARN in SSM is invalid." >&2
            exit 1
          fi
          if [[ ! "${service_order_event_bus_name}" =~ ^[A-Za-z0-9._-]{1,256}$ ]]; then
            echo "The service-order event bus name in SSM is invalid." >&2
            exit 1
          fi
          if [[ ! "${service_order_publisher_role_arn}" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "The service-order publisher role ARN in SSM is invalid." >&2
            exit 1
          fi
          {
            echo "cluster_name=${cluster_name}"
            echo "migration_secret_arn=${migration_secret_arn}"
            echo "service_order_event_bus_name=${service_order_event_bus_name}"
            echo "service_order_publisher_role_arn=${service_order_publisher_role_arn}"
          } >> "${GITHUB_OUTPUT}"

      - name: Connect to EKS
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ steps.eks.outputs.cluster_name }}
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Deploy to staging
        env:
          IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
          MIGRATION_DATABASE_SECRET_ARN: ${{ steps.eks.outputs.migration_secret_arn }}
          SERVICE_ORDER_EVENT_BUS_NAME: ${{ steps.eks.outputs.service_order_event_bus_name }}
          SERVICE_ORDER_PUBLISHER_ROLE_ARN: ${{ steps.eks.outputs.service_order_publisher_role_arn }}
        run: ./k8s/scripts/deploy.sh staging "${IMAGE_REFERENCE}"

  deploy-staging-frontend:
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success' && vars.DEPLOY_STAGING_FRONTEND_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    with:
      github_environment: hml
      api_stage: hml
      session_id: ${{ inputs.session_id }}
      started_at: ${{ inputs.started_at }}
      session_mode: ${{ inputs.session_mode }}
      session_token: ${{ inputs.session_token }}
    secrets: inherit

  deploy-staging-frontend-skipped:
    needs: deploy-staging
    if: always() && github.event_name == 'push' && vars.DEPLOY_STAGING_ENABLED == 'true' && vars.DEPLOY_STAGING_FRONTEND_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Frontend deployment gated
        run: 'echo "Frontend staging deploy skipped: set DEPLOY_STAGING_FRONTEND_ENABLED=true after approval."'

  deploy-staging-skipped:
    needs: [build-push, lifecycle-authorization]
    if: always() && github.event_name == 'push' && vars.DEPLOY_STAGING_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gated until staging infra (#87)
        env:
          IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
        run: |
          echo "Imagem publicada: ${IMAGE_REFERENCE}"
          echo "Deploy staging ignorado: defina a variável de repositório DEPLOY_STAGING_ENABLED=true."
          echo "GitHub Environment hml: AWS_REGION and variable AWS_DEPLOY_ROLE_ARN_HML; cluster name comes from SSM."
          echo "Ver .github/CD.md"

