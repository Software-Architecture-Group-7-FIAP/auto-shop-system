name: CD Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    uses: ./.github/workflows/reusable-build-push.yml
    secrets: inherit

  deploy-production:
    needs: build-push
    if: vars.DEPLOY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Connect to EKS
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${EKS_CLUSTER_NAME}" || -z "${AWS_REGION}" ]]; then
            echo "Environment production requires EKS_CLUSTER_NAME and AWS_REGION."
            exit 1
          fi
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Deploy to production (rolling via Deployment rollout)
        run: ./k8s/scripts/deploy.sh production "${IMAGE_REFERENCE}" yes

  deploy-production-skipped:
    needs: build-push
    if: vars.DEPLOY_PRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gated until production infra is ready
        env:
          IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
        run: |
          echo "Imagem publicada: ${IMAGE_REFERENCE}"
          echo "Deploy produção ignorado: defina a variável de repositório DEPLOY_PRODUCTION_ENABLED=true."
          echo "No Environment production: approval, EKS_CLUSTER_NAME, AWS_REGION e o secret AWS_DEPLOY_ROLE_ARN."
          echo "Ver .github/CD.md"
