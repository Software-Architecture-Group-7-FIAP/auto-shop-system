name: CD Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    uses: ./.github/workflows/reusable-build-push.yml
    secrets: inherit

  deploy-production:
    needs: build-push
    if: vars.DEPLOY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Resolve EKS cluster name from SSM
        id: eks
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SSM_PARAMETER_PREFIX: /auto-shop/staging
        run: |
          set -euo pipefail
          if [[ -z "${AWS_REGION}" ]]; then
            echo "Environment production requires AWS_REGION."
            exit 1
          fi
          cluster_name="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/eks/cluster-name" \
            --query 'Parameter.Value' --output text)"
          migration_secret_arn="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/database/secrets/migrations-prd-arn" \
            --query 'Parameter.Value' --output text)"
          service_order_event_bus_name="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/events/service-order-bus-name/prd" \
            --query 'Parameter.Value' --output text)"
          service_order_publisher_role_arn="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/events/service-order-publisher-role-arn/prd" \
            --query 'Parameter.Value' --output text)"
          if [[ -z "${cluster_name}" || ! "${migration_secret_arn}" =~ ^arn:aws:secretsmanager: \
            || ! "${service_order_event_bus_name}" =~ ^[A-Za-z0-9._-]{1,256}$ \
            || ! "${service_order_publisher_role_arn}" =~ ^arn:aws:iam::[0-9]{12}:role/ ]]; then
            echo "The EKS cluster, migration secret, or service-order event configuration is missing from SSM." >&2
            exit 1
          fi
          echo "cluster_name=${cluster_name}" >> "${GITHUB_OUTPUT}"
          echo "migration_secret_arn=${migration_secret_arn}" >> "${GITHUB_OUTPUT}"
          echo "service_order_event_bus_name=${service_order_event_bus_name}" >> "${GITHUB_OUTPUT}"
          echo "service_order_publisher_role_arn=${service_order_publisher_role_arn}" >> "${GITHUB_OUTPUT}"

      - name: Connect to EKS
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ steps.eks.outputs.cluster_name }}
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Deploy to production (rolling via Deployment rollout)
        env:
          MIGRATION_DATABASE_SECRET_ARN: ${{ steps.eks.outputs.migration_secret_arn }}
          SERVICE_ORDER_EVENT_BUS_NAME: ${{ steps.eks.outputs.service_order_event_bus_name }}
          SERVICE_ORDER_PUBLISHER_ROLE_ARN: ${{ steps.eks.outputs.service_order_publisher_role_arn }}
        run: ./k8s/scripts/deploy.sh production "${IMAGE_REFERENCE}" yes

  deploy-production-frontend:
    needs: deploy-production
    if: vars.DEPLOY_PRODUCTION_ENABLED == 'true'
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    with:
      github_environment: production
      api_stage: prd
    secrets: inherit

  deploy-production-skipped:
    needs: build-push
    if: vars.DEPLOY_PRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gated until production infra is ready
        env:
          IMAGE_REFERENCE: ${{ needs.build-push.outputs.image_reference }}
        run: |
          echo "Imagem publicada: ${IMAGE_REFERENCE}"
          echo "Deploy produção ignorado: defina a variável de repositório DEPLOY_PRODUCTION_ENABLED=true."
          echo "No Environment production: approval, AWS_REGION e o secret AWS_DEPLOY_ROLE_ARN; o nome do cluster vem do SSM."
          echo "Ver .github/CD.md"
