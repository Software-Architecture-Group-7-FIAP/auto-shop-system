name: CD Production
run-name: lifecycle:${{ inputs.session_id || format('push-{0}', github.run_id) }}:app-deploy:${{ inputs.lifecycle_dispatch_id || github.run_id }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      session_id:
        description: Coordinator-provided production session ID
        required: true
        type: string
      started_at:
        description: Coordinator-provided UTC session start, YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string
      session_mode:
        description: Coordinator-authorized production session
        required: true
        type: choice
        options: [prd-window]
      session_token:
        description: Signed coordinator session capability; validation fails if missing.
        required: false
        type: string
      lifecycle_dispatch_id:
        description: Optional coordinator correlation ID.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle-authorization:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Require main as the PRD source branch
        env:
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "refs/heads/main" ]] || {
            echo "::error::PRD deployments must run from main."
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate coordinator inputs and static production gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SESSION_ID: ${{ inputs.session_id }}
          REQUESTED_STARTED_AT: ${{ inputs.started_at }}
          REQUESTED_SESSION_MODE: ${{ inputs.session_mode }}
          SESSION_MODE: ${{ inputs.session_mode }}
          LIFECYCLE_SESSION_TOKEN: ${{ inputs.session_token }}
          LIFECYCLE_SESSION_SIGNING_KEY: ${{ secrets.LIFECYCLE_SESSION_SIGNING_KEY }}
          ENVIRONMENT_SCHEDULE_ENABLED: ${{ vars.ENVIRONMENT_SCHEDULE_ENABLED || 'false' }}
          PRD_LIFECYCLE_AUTOMATION_READY: ${{ vars.PRD_LIFECYCLE_AUTOMATION_READY || 'false' }}
          PRD_COST_EXCEPTION_APPROVED: ${{ vars.PRD_COST_EXCEPTION_APPROVED || 'false' }}
          ENVIRONMENT_ACTIVE: ${{ vars.ENVIRONMENT_ACTIVE }}
          ENVIRONMENT_WINDOW_AUTHORIZED: ${{ vars.ENVIRONMENT_WINDOW_AUTHORIZED }}
          DEPLOY_PRODUCTION_ENABLED: ${{ vars.DEPLOY_PRODUCTION_ENABLED || 'false' }}
          ALLOW_SYNTHETIC_SEED_IN_PRD: ${{ vars.ALLOW_SYNTHETIC_SEED_IN_PRD || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENVIRONMENT_SCHEDULE_ENABLED" == "true" ]] || { echo "::error::ENVIRONMENT_SCHEDULE_ENABLED is not true."; exit 1; }
          [[ "$PRD_LIFECYCLE_AUTOMATION_READY" == "true" ]] || { echo "::error::PRD_LIFECYCLE_AUTOMATION_READY is not true."; exit 1; }
          [[ "$PRD_COST_EXCEPTION_APPROVED" == "true" ]] || { echo "::error::PRD_COST_EXCEPTION_APPROVED is not true."; exit 1; }
          [[ "$DEPLOY_PRODUCTION_ENABLED" == "true" ]] || { echo "::error::DEPLOY_PRODUCTION_ENABLED is not true."; exit 1; }
          [[ "$ALLOW_SYNTHETIC_SEED_IN_PRD" == "true" ]] || { echo "::error::ALLOW_SYNTHETIC_SEED_IN_PRD is not true."; exit 1; }
          [[ "$ENVIRONMENT_ACTIVE" == "true" && "$ENVIRONMENT_WINDOW_AUTHORIZED" == "true" ]] || {
            echo "::error::Production static authorization gates are not enabled."
            exit 1
          }
          [[ "$REQUESTED_SESSION_MODE" == "prd-window" ]] || { echo "::error::session_mode must be prd-window."; exit 1; }
          local_hour="$(TZ=America/Sao_Paulo date +%H)"
          action=operate
          if [[ "$local_hour" -lt 7 ]]; then action=start; fi
          ENVIRONMENT_SESSION_ID="$REQUESTED_SESSION_ID" \
            ENVIRONMENT_WINDOW_STARTED_AT="$REQUESTED_STARTED_AT" \
            SESSION_MODE="$REQUESTED_SESSION_MODE" \
            ENVIRONMENT_STAGE=prd \
            python3 .github/scripts/validate_environment_window.py --action "$action"

  build-push:
    needs: lifecycle-authorization
    if: always() && (github.event_name == 'push' || needs.lifecycle-authorization.result == 'success')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-push.yml
    secrets: inherit

  deploy-production:
    needs: [build-push, lifecycle-authorization]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_PRODUCTION_ENABLED == 'true' &&
      needs.build-push.result == 'success' &&
      needs.lifecycle-authorization.result == 'success'
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      SOURCE_IMAGE: ${{ needs.build-push.outputs.ghcr_image_reference }}
      ALLOW_SYNTHETIC_SEED_IN_PRD: ${{ vars.ALLOW_SYNTHETIC_SEED_IN_PRD || 'false' }}
      LIFECYCLE_SESSION_ID: ${{ inputs.session_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the authorized PRD deployment window
        env:
          ENVIRONMENT_ACTIVE: ${{ vars.ENVIRONMENT_ACTIVE }}
          ENVIRONMENT_WINDOW_AUTHORIZED: ${{ vars.ENVIRONMENT_WINDOW_AUTHORIZED }}
          ENVIRONMENT_SESSION_ID: ${{ inputs.session_id }}
          ENVIRONMENT_WINDOW_STARTED_AT: ${{ inputs.started_at }}
          ENVIRONMENT_STAGE: prd
          SESSION_MODE: ${{ inputs.session_mode }}
          LIFECYCLE_SESSION_TOKEN: ${{ inputs.session_token }}
          LIFECYCLE_SESSION_SIGNING_KEY: ${{ secrets.LIFECYCLE_SESSION_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SESSION_MODE" == "prd-window" ]] || { echo "::error::session_mode must be prd-window."; exit 1; }
          local_hour="$(TZ=America/Sao_Paulo date +%H)"
          if [[ "${local_hour}" -lt 7 ]]; then
            action=start
          else
            action=operate
          fi
          python3 .github/scripts/validate_environment_window.py --action "${action}"

      - name: Validate the Terraform-managed PRD deploy role ARN
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ROLE_ARN" == "arn:aws:iam::035611741563:role/auto-shop-staging-github-production" ]] || {
            echo "::error::Set AWS_DEPLOY_ROLE_ARN_PRD to Terraform output github_deploy_role_arn_production before PRD deployment."
            exit 1
          }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PRD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Mirror authenticated GHCR image to private ECR
        id: ecr_image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image_reference="$(python3 scripts/mirror_ghcr_image_to_ecr.py "${SOURCE_IMAGE}")"
          echo "image_reference=${image_reference}" >> "${GITHUB_OUTPUT}"

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.1

      - name: Resolve EKS cluster name from SSM
        id: eks
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SSM_PARAMETER_PREFIX: /auto-shop/staging
        run: |
          set -euo pipefail
          if [[ -z "${AWS_REGION}" ]]; then
            echo "Environment production requires AWS_REGION."
            exit 1
          fi
          cluster_name="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/eks/cluster-name" \
            --query 'Parameter.Value' --output text)"
          migration_secret_arn="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/database/secrets/migrations-prd-arn" \
            --query 'Parameter.Value' --output text)"
          service_order_event_bus_name="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/events/service-order-bus-name/prd" \
            --query 'Parameter.Value' --output text)"
          service_order_publisher_role_arn="$(aws ssm get-parameter \
            --name "${SSM_PARAMETER_PREFIX}/events/service-order-publisher-role-arn/prd" \
            --query 'Parameter.Value' --output text)"
          if [[ ! "${cluster_name}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$ ]]; then
            echo "The EKS cluster name in SSM is invalid." >&2
            exit 1
          fi
          if [[ ! "${migration_secret_arn}" =~ ^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$ ]]; then
            echo "The migration secret ARN in SSM is invalid." >&2
            exit 1
          fi
          if [[ ! "${service_order_event_bus_name}" =~ ^[A-Za-z0-9._-]{1,256}$ ]]; then
            echo "The service-order event bus name in SSM is invalid." >&2
            exit 1
          fi
          if [[ ! "${service_order_publisher_role_arn}" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "The service-order publisher role ARN in SSM is invalid." >&2
            exit 1
          fi
          {
            echo "cluster_name=${cluster_name}"
            echo "migration_secret_arn=${migration_secret_arn}"
            echo "service_order_event_bus_name=${service_order_event_bus_name}"
            echo "service_order_publisher_role_arn=${service_order_publisher_role_arn}"
          } >> "${GITHUB_OUTPUT}"

      - name: Connect to EKS
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ steps.eks.outputs.cluster_name }}
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Deploy to production (rolling via Deployment rollout)
        env:
          IMAGE_REFERENCE: ${{ steps.ecr_image.outputs.image_reference }}
          MIGRATION_DATABASE_SECRET_ARN: ${{ steps.eks.outputs.migration_secret_arn }}
          SERVICE_ORDER_EVENT_BUS_NAME: ${{ steps.eks.outputs.service_order_event_bus_name }}
          SERVICE_ORDER_PUBLISHER_ROLE_ARN: ${{ steps.eks.outputs.service_order_publisher_role_arn }}
          ALLOW_SYNTHETIC_SEED_IN_PRD: ${{ env.ALLOW_SYNTHETIC_SEED_IN_PRD }}
          LIFECYCLE_SESSION_ID: ${{ env.LIFECYCLE_SESSION_ID }}
        run: ./k8s/scripts/deploy.sh production "${IMAGE_REFERENCE}" yes

  deploy-production-frontend:
    needs: deploy-production
    if: github.event_name == 'workflow_dispatch' && vars.DEPLOY_PRODUCTION_ENABLED == 'true' && vars.DEPLOY_PRODUCTION_FRONTEND_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    with:
      github_environment: prd
      api_stage: prd
      session_id: ${{ inputs.session_id }}
      started_at: ${{ inputs.started_at }}
      session_mode: ${{ inputs.session_mode }}
      session_token: ${{ inputs.session_token }}
    secrets: inherit

  deploy-production-skipped:
    needs: [build-push, lifecycle-authorization]
    if: always() && github.event_name == 'push' && vars.DEPLOY_PRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gated until production infra is ready
        env:
          IMAGE_REFERENCE: ${{ needs.build-push.outputs.ghcr_image_reference }}
        run: |
          echo "Imagem publicada: ${IMAGE_REFERENCE}"
          echo "Deploy produção ignorado: defina a variável de repositório DEPLOY_PRODUCTION_ENABLED=true."
          echo "GitHub Environment prd: approval, AWS_REGION, and variable AWS_DEPLOY_ROLE_ARN_PRD; cluster name comes from SSM."
          echo "Ver .github/CD.md"

  push-deploy-gated:
    needs: [build-push, lifecycle-authorization]
    if: always() && github.event_name == 'push' && vars.DEPLOY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep production changes behind the lifecycle coordinator
        run: echo "Push build completed; production deploy requires workflow_dispatch with a validated session_id, started_at, and session_mode."

