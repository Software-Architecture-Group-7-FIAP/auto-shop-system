name: New Relic HML service-order dashboard and alerts
run-name: new-relic:hml-service-order:${{ inputs.action }}:${{ inputs.session_id }}:${{ inputs.lifecycle_dispatch_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate, plan, apply, disable, or record sanitized evidence for the HML single-event drill
        required: true
        type: choice
        options: [validate, plan, apply, disable, evidence]
        default: validate
      region:
        description: New Relic control-plane region
        required: true
        type: choice
        options: [us, eu]
        default: us
      session_id:
        description: Coordinator-provided HML session ID
        required: true
        type: string
      started_at:
        description: Coordinator-provided UTC session start, YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string
      session_mode:
        description: Authorized HML window
        required: true
        type: choice
        options: [hml]
      session_token:
        description: Signed coordinator session capability
        required: true
        type: string
      lifecycle_dispatch_id:
        description: Coordinator-generated run correlation ID
        required: false
        type: string
      confirm_apply:
        description: Confirm that apply or disable may mutate only owned New Relic resources
        required: true
        type: boolean
        default: false
      confirm_business_telemetry:
        description: Confirm the HML event schema and individual trace follow-up were checked in this signed session
        required: true
        type: boolean
        default: false
      confirm_failure_threshold:
        description: Confirm the HML SRE owner approved the provisional single-failure threshold and route
        required: true
        type: boolean
        default: false
      confirm_notification_route:
        description: Confirm the owner-approved route will be attached manually before the synthetic failure
        required: true
        type: boolean
        default: false
      evidence_window_started_at:
        description: Evidence window start in UTC, YYYY-MM-DDTHH:MM:SSZ; required for evidence action
        required: false
        type: string
      evidence_window_ended_at:
        description: Evidence window end in UTC, YYYY-MM-DDTHH:MM:SSZ; required for evidence action
        required: false
        type: string
      baseline_failure_count:
        description: Operator-observed failure count before the synthetic event; required for evidence action
        required: false
        type: choice
        options: [not-recorded, "0", "1+"]
        default: not-recorded
      drill_failure_count:
        description: Operator-observed failures in the bounded drill window; required for evidence action
        required: false
        type: choice
        options: [not-recorded, "0", "1", "2+"]
        default: not-recorded
      trace_correlation_outcome:
        description: Whether trace linking was found on the one inspected event; raw IDs are never recorded
        required: false
        type: choice
        options: [not-reviewed, linked, unavailable]
        default: not-reviewed
      confirm_baseline_clear:
        description: Confirm the bounded baseline query returned zero service-order failure events
        required: true
        type: boolean
        default: false
      confirm_single_failure_observed:
        description: Confirm exactly one synthetic service-order failure was observed in the drill window
        required: true
        type: boolean
        default: false
      confirm_incident_opened:
        description: Confirm the service-order alert opened an incident for the single synthetic event
        required: true
        type: boolean
        default: false
      confirm_approved_route_only:
        description: Confirm delivery reached only the approved HML SRE notification route
        required: true
        type: boolean
        default: false
      confirm_trace_reviewed:
        description: Confirm the inspected event's trace-linking outcome was reviewed without copying raw IDs
        required: true
        type: boolean
        default: false
      confirm_incident_closed:
        description: Confirm the incident closed after the single event aged out of the alert window
        required: true
        type: boolean
        default: false
      confirm_condition_disabled:
        description: Confirm the owned service-order condition is disabled for cleanup
        required: true
        type: boolean
        default: false
      confirm_route_detached:
        description: Confirm the manually attached HML SRE notification route was detached after the drill
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: new-relic-hml-service-order
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: hml
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Mask signed coordinator session capability
        env:
          LIFECYCLE_SESSION_TOKEN: ${{ inputs.session_token }}
        shell: bash
        run: echo "::add-mask::$LIFECYCLE_SESSION_TOKEN"

      - name: Validate requested action and confirmations
        id: validate_inputs
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
          CONFIRM_BUSINESS_TELEMETRY: ${{ inputs.confirm_business_telemetry }}
          CONFIRM_FAILURE_THRESHOLD: ${{ inputs.confirm_failure_threshold }}
          CONFIRM_NOTIFICATION_ROUTE: ${{ inputs.confirm_notification_route }}
          BASELINE_FAILURE_COUNT: ${{ inputs.baseline_failure_count }}
          DRILL_FAILURE_COUNT: ${{ inputs.drill_failure_count }}
          TRACE_CORRELATION_OUTCOME: ${{ inputs.trace_correlation_outcome }}
          CONFIRM_BASELINE_CLEAR: ${{ inputs.confirm_baseline_clear }}
          CONFIRM_SINGLE_FAILURE_OBSERVED: ${{ inputs.confirm_single_failure_observed }}
          CONFIRM_INCIDENT_OPENED: ${{ inputs.confirm_incident_opened }}
          CONFIRM_APPROVED_ROUTE_ONLY: ${{ inputs.confirm_approved_route_only }}
          CONFIRM_TRACE_REVIEWED: ${{ inputs.confirm_trace_reviewed }}
          CONFIRM_INCIDENT_CLOSED: ${{ inputs.confirm_incident_closed }}
          CONFIRM_CONDITION_DISABLED: ${{ inputs.confirm_condition_disabled }}
          CONFIRM_ROUTE_DETACHED: ${{ inputs.confirm_route_detached }}
          SESSION_STARTED_AT: ${{ inputs.started_at }}
          EVIDENCE_WINDOW_STARTED_AT: ${{ inputs.evidence_window_started_at }}
          EVIDENCE_WINDOW_ENDED_AT: ${{ inputs.evidence_window_ended_at }}
          REQUESTED_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ACTION" == "apply" || "$ACTION" == "disable" ]]; then
            [[ "$CONFIRM_APPLY" == "true" ]]
          fi
          if [[ "$ACTION" == "apply" ]]; then
            [[ "$CONFIRM_BUSINESS_TELEMETRY" == "true" ]]
            [[ "$CONFIRM_FAILURE_THRESHOLD" == "true" ]]
            [[ "$CONFIRM_NOTIFICATION_ROUTE" == "true" ]]
          fi
          if [[ "$ACTION" == "evidence" ]]; then
            [[ "$BASELINE_FAILURE_COUNT" == "0" ]]
            [[ "$DRILL_FAILURE_COUNT" == "1" ]]
            [[ "$TRACE_CORRELATION_OUTCOME" == "linked" || "$TRACE_CORRELATION_OUTCOME" == "unavailable" ]]
            [[ "$CONFIRM_BASELINE_CLEAR" == "true" ]]
            [[ "$CONFIRM_SINGLE_FAILURE_OBSERVED" == "true" ]]
            [[ "$CONFIRM_INCIDENT_OPENED" == "true" ]]
            [[ "$CONFIRM_APPROVED_ROUTE_ONLY" == "true" ]]
            [[ "$CONFIRM_TRACE_REVIEWED" == "true" ]]
            [[ "$CONFIRM_INCIDENT_CLOSED" == "true" ]]
            [[ "$CONFIRM_CONDITION_DISABLED" == "true" ]]
            [[ "$CONFIRM_ROUTE_DETACHED" == "true" ]]
            python3 - "$SESSION_STARTED_AT" "$EVIDENCE_WINDOW_STARTED_AT" "$EVIDENCE_WINDOW_ENDED_AT" <<'PY'
          import os
          import sys
          from datetime import datetime, timedelta, timezone

          utc_format = "%Y-%m-%dT%H:%M:%SZ"

          def parse(value):
              try:
                  parsed = datetime.strptime(value, utc_format).replace(tzinfo=timezone.utc)
              except ValueError:
                  raise SystemExit("Evidence timestamps must use UTC YYYY-MM-DDTHH:MM:SSZ format.") from None
              if parsed.strftime(utc_format) != value:
                  raise SystemExit("Evidence timestamps must use canonical UTC format.")
              return parsed

          session_start, evidence_start, evidence_end = map(parse, sys.argv[1:])
          baseline_start = evidence_start - timedelta(minutes=10)
          now = datetime.now(timezone.utc)
          if baseline_start < session_start or evidence_end <= evidence_start:
              raise SystemExit("The 10-minute baseline and drill window must follow the signed HML session start.")
          if evidence_end - baseline_start > timedelta(minutes=30):
              raise SystemExit("The maximum evidence period, including baseline, is 30 minutes.")
          if evidence_end > now:
              raise SystemExit("The evidence window end cannot be in the future.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"baseline_window_started_at={baseline_start.strftime(utc_format)}\n")
          PY
          fi

      - name: Validate coordinator inputs and HML session gates
        env:
          SOURCE_REF: ${{ github.ref }}
          SESSION_ID: ${{ inputs.session_id }}
          STARTED_AT: ${{ inputs.started_at }}
          SESSION_MODE: ${{ inputs.session_mode }}
          LIFECYCLE_SESSION_TOKEN: ${{ inputs.session_token }}
          LIFECYCLE_SESSION_SIGNING_KEY: ${{ secrets.LIFECYCLE_SESSION_SIGNING_KEY }}
          STAGING_ACTIVE: ${{ vars.STAGING_ACTIVE || 'false' }}
          STAGING_SESSION_AUTHORIZED: ${{ vars.STAGING_SESSION_AUTHORIZED || 'false' }}
          STAGING_SESSION_ALLOW_ANY_TIME: ${{ vars.STAGING_SESSION_ALLOW_ANY_TIME || 'false' }}
          AUTHORIZED_SESSION_MODE: ${{ vars.STAGING_SESSION_MODE || '' }}
          REQUESTED_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "refs/heads/develop" ]]
          [[ "$STAGING_ACTIVE" == "true" && "$STAGING_SESSION_AUTHORIZED" == "true" ]]
          [[ "$AUTHORIZED_SESSION_MODE" == "hml" && "$SESSION_MODE" == "hml" ]]
          validator_action=operate
          if [[ "$REQUESTED_ACTION" == "disable" || "$REQUESTED_ACTION" == "evidence" ]]; then
            validator_action=teardown
          fi
          ENVIRONMENT_ACTIVE="$STAGING_ACTIVE" \
            ENVIRONMENT_WINDOW_AUTHORIZED="$STAGING_SESSION_AUTHORIZED" \
            ENVIRONMENT_SESSION_ID="$SESSION_ID" \
            ENVIRONMENT_WINDOW_STARTED_AT="$STARTED_AT" \
            ENVIRONMENT_STAGE=hml \
            SESSION_MODE="$SESSION_MODE" \
            python3 .github/scripts/validate_environment_window.py --action "$validator_action"

      - name: Validate service-order dashboard and alert contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/observability/provision_technical_observability.py validate \
            --profile service-order \
            --dashboard observability/new-relic/service-order-dashboard.json \
            --alerts observability/new-relic/service-order-alerts.json \
            --region "${{ inputs.region }}"

      - name: Plan or reconcile owned New Relic resources
        if: inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'disable'
        env:
          ACTION: ${{ inputs.action }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_REGION: ${{ inputs.region }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(python3 scripts/observability/provision_technical_observability.py \
            "$ACTION" \
            --profile service-order \
            --dashboard observability/new-relic/service-order-dashboard.json \
            --alerts observability/new-relic/service-order-alerts.json \
            --region "$NEW_RELIC_REGION")"
          unset NEW_RELIC_USER_API_KEY
          {
            echo "### New Relic HML service-order reconciliation"
            echo '```json'
            printf '%s\n' "$result"
            echo '```'
            echo "The hml-sre-approved-workflow destination is reviewed and attached separately; this provisioner never attaches notification destinations."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record sanitized service-order drill evidence
        if: inputs.action == 'evidence'
        env:
          SESSION_ID: ${{ inputs.session_id }}
          BASELINE_WINDOW_STARTED_AT: ${{ steps.validate_inputs.outputs.baseline_window_started_at }}
          EVIDENCE_WINDOW_STARTED_AT: ${{ inputs.evidence_window_started_at }}
          EVIDENCE_WINDOW_ENDED_AT: ${{ inputs.evidence_window_ended_at }}
          BASELINE_FAILURE_COUNT: ${{ inputs.baseline_failure_count }}
          DRILL_FAILURE_COUNT: ${{ inputs.drill_failure_count }}
          TRACE_CORRELATION_OUTCOME: ${{ inputs.trace_correlation_outcome }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### HML service-order single-event drill evidence"
            echo "Session: \`$SESSION_ID\`"
            echo "Baseline query interval (UTC): \`$BASELINE_WINDOW_STARTED_AT\` to \`$EVIDENCE_WINDOW_STARTED_AT\` (10 minutes)"
            echo "Drill query interval (UTC): \`$EVIDENCE_WINDOW_STARTED_AT\` to \`$EVIDENCE_WINDOW_ENDED_AT\`"
            echo "Baseline failure count: \`$BASELINE_FAILURE_COUNT\` (operator-attested)"
            echo "Drill failure count: \`$DRILL_FAILURE_COUNT\` (operator-attested)"
            echo "Trace correlation outcome: \`$TRACE_CORRELATION_OUTCOME\`; raw trace and span IDs are not recorded."
            echo "Incident open and close, approved-route-only delivery, condition disable, and route detach were explicitly confirmed."
            echo "Operator attestations only: this workflow did not inject an event or query New Relic logs or incidents."
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
