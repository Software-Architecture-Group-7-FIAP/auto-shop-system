name: Build, security, and Kubernetes validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-shop-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REFERENCE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Validate lock file
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --no-interaction --sync
      - name: Run tests with coverage gate
        run: poetry run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: Run Bandit
        run: poetry run bandit -r src -ll
      - name: Run pip-audit
        run: poetry run pip-audit --skip-editable
      - name: Check unsafe defaults and release image
        run: poetry run python scripts/check_unsafe_defaults.py --image-reference "$IMAGE_REFERENCE"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config
      - name: Build immutable release image
        shell: bash
        run: docker build --tag "${IMAGE_REFERENCE,,}" .
      - name: Render and validate every environment phase
        shell: bash
        run: |
          set -euo pipefail
          image_reference="${IMAGE_REFERENCE,,}"
          for environment in local staging production; do
            for phase in foundation migration app ingress; do
              output="$(mktemp)"
              kubectl kustomize "k8s/overlays/${environment}/${phase}" \
                | sed "s#registry.example.com/auto-shop-system:__IMAGE_TAG__#${image_reference}#g" \
                > "$output"
              if grep -Eiq 'secrets\.example|:latest' "$output"; then
                echo "Unsafe value found in ${environment}/${phase}"
                exit 1
              fi
              if [[ "$environment" != "local" ]] && grep -Eiq 'http://|localhost|mailhog|__IMAGE_TAG__' "$output"; then
                echo "Production-like overlay contains a local, HTTP, or unresolved value: ${environment}/${phase}"
                exit 1
              fi
              docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict -ignore-missing-schemas < "$output"
              rm -f "$output"
            done
          done

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          version: v0.30.0
          node_image: kindest/node:v1.34.0
          cluster_name: kind
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
      - name: Validate Terraform formatting and configuration
        run: |
          set -euo pipefail
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra validate
      - name: Plan and verify every Terraform environment
        run: |
          set -euo pipefail
          secure_image="ghcr.io/example/auto-shop-system@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

          plan_and_check() {
            environment="$1"
            shift
            plan_file="$(mktemp)"
            plan_json="$(mktemp)"
            trap 'rm -f "$plan_file" "$plan_json"' RETURN

            terraform -chdir=infra plan \
              -input=false \
              -refresh=false \
              -var-file=terraform.tfvars.example \
              -var=kube_context=kind-kind \
              "$@" \
              -out="$plan_file"
            terraform -chdir=infra show -json "$plan_file" > "$plan_json"

            jq -e '
              [.resource_changes[].address] as $addresses
              | [
                  "kubernetes_namespace_v1.auto_shop",
                  "kubernetes_config_map_v1.app",
                  "kubernetes_job_v1.migration",
                  "kubernetes_deployment_v1.backend",
                  "kubernetes_service_v1.backend",
                  "kubernetes_horizontal_pod_autoscaler_v2.backend",
                  "kubernetes_ingress_v1.backend[0]"
                ]
              | all(. as $address | $addresses | index($address) != null)
            ' "$plan_json"

            postgres_count="$(jq '[.resource_changes[].address | select(test("^kubernetes_(persistent_volume_claim_v1|deployment_v1|service_v1)\\.postgres\\[0\\]$"))] | length' "$plan_json")"
            if [[ "$environment" == "local" ]]; then
              [[ "$postgres_count" -eq 3 ]] || {
                echo "Local plan must contain PVC, Deployment, and Service for PostgreSQL; found $postgres_count"
                exit 1
              }
            else
              [[ "$postgres_count" -eq 0 ]] || {
                echo "$environment plan must not contain local PostgreSQL resources; found $postgres_count"
                exit 1
              }
            fi
          }

          plan_and_check local \
            -var=environment=local \
            -var=enable_local_database=true

          plan_and_check staging \
            -var=environment=staging \
            -var=app_env=staging \
            -var=image_reference="$secure_image" \
            -var=app_base_url=https://api.staging.example.com \
            -var=frontend_public_url=https://staging.example.com \
            -var=cors_allowed_origins=https://staging.example.com \
            -var=security_hsts_enabled=true \
            -var=smtp_host=smtp.staging.example.com \
            -var=smtp_use_tls=true \
            -var=smtp_starttls=true \
            -var=smtp_require_tls=true \
            -var=skip_cpf_external_validation=false \
            -var=ingress_host=api.staging.example.com \
            -var=enable_local_database=false

          plan_and_check production \
            -var=environment=production \
            -var=app_env=production \
            -var=image_reference="$secure_image" \
            -var=app_base_url=https://api.example.com \
            -var=frontend_public_url=https://example.com \
            -var=cors_allowed_origins=https://example.com \
            -var=security_hsts_enabled=true \
            -var=smtp_host=smtp.example.com \
            -var=smtp_use_tls=true \
            -var=smtp_starttls=true \
            -var=smtp_require_tls=true \
            -var=skip_cpf_external_validation=false \
            -var=ingress_host=api.example.com \
            -var=enable_local_database=false

  cluster-smoke:
    runs-on: ubuntu-latest
    needs: [test-and-security, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          version: v0.30.0
          node_image: kindest/node:v1.34.0
          cluster_name: kind
      - name: Build and load local image
        run: |
          docker build --load --provenance=false --tag auto-shop-system:local .
          kind load docker-image auto-shop-system:local
      - name: Create ephemeral local Secret
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          db_password="$(openssl rand -hex 24)"
          secret_key="$(openssl rand -hex 32)"
          {
            printf 'DATABASE_URL=postgresql://oficina:%s@postgres-service:5432/oficina\n' "$db_password"
            printf 'DB_NAME=oficina\nDB_USER=oficina\nDB_PASSWORD=%s\n' "$db_password"
            printf 'SECRET_KEY=%s\nINVERTEXTO_API_TOKEN=local-ci-token\nSMTP_USER=\nSMTP_PASSWORD=\n' "$secret_key"
          } > "$secret_file"
          kubectl apply -k k8s/overlays/local/foundation
          kubectl create secret generic auto-shop-secrets --namespace auto-shop \
            --from-env-file="$secret_file"
      - name: Run migration before API rollout
        run: |
          set -euo pipefail
          kubectl wait --for=condition=available deployment/postgres --namespace auto-shop --timeout=180s
          kubectl apply -k k8s/overlays/local/migration
          kubectl wait --for=condition=complete job/auto-shop-migrate --namespace auto-shop --timeout=300s
          kubectl apply -k k8s/overlays/local/app
          kubectl rollout status deployment/auto-shop-backend --namespace auto-shop --timeout=300s
          kubectl apply -k k8s/overlays/local/ingress
      - name: Smoke test liveness, readiness, and docs
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward --namespace auto-shop service/auto-shop-backend-service 18000:80 > /tmp/port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid"' EXIT
          for endpoint in health/live health/ready docs; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:18000/${endpoint}" > /dev/null; then
                break
              fi
              if [[ "$attempt" == 30 ]]; then
                cat /tmp/port-forward.log
                exit 1
              fi
              sleep 1
            done
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -p tsconfig.spec.json --noEmit
      - name: Build
        run: npm run build
      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
