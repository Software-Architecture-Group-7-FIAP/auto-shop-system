apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-shop-config
  namespace: default
  labels:
    app.kubernetes.io/name: auto-shop-system
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: auto-shop-platform
    app.kubernetes.io/managed-by: kubectl
data:
  # Configurações do Servidor / Aplicação
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
  ALLOWED_ORIGINS: "https://autoshop.local,https://admin.autoshop.local"

  # Banco de Dados & Cache (Apenas dados de conexões/endereço - credenciais vão no Secret)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "autoshop_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # Parâmetros de Negócio / Notificações
  EMAIL_FROM_ADDRESS: "no-reply@autoshop.com"
  BUDGET_EXPIRATION_DAYS: "15"
  CURRENCY: "BRL"
