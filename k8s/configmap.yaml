# Non-sensitive settings only. Credentials live in k8s/secrets.yaml (gitignored).
# Keys match src/config.py / pydantic Settings (env names).
apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-shop-config
  namespace: auto-shop
  labels:
    app.kubernetes.io/name: auto-shop-system
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: auto-shop-platform
    app.kubernetes.io/managed-by: kubectl
data:
  APP_ENV: "production"
  APP_BASE_URL: "http://api.autoshop.com:8080"
  FRONTEND_PUBLIC_URL: "http://api.autoshop.com:8080"
  CORS_ALLOWED_ORIGINS: "http://api.autoshop.com:8080,http://www.api.autoshop.com:8080,http://localhost:4200"
  CORS_ALLOW_CREDENTIALS: "true"
  SECURITY_HSTS_ENABLED: "false"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  BUDGET_APPROVAL_TOKEN_EXPIRE_HOURS: "72"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@autoshop.local"
  SMTP_USER: ""
  SMTP_USE_TLS: "false"
  SMTP_STARTTLS: "true"
  SMTP_REQUIRE_TLS: "false"
  SKIP_CPF_EXTERNAL_VALIDATION: "false"
