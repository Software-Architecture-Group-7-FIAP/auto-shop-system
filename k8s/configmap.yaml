apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-shop-config
  namespace: auto-shop
  labels:
    app.kubernetes.io/name: auto-shop-system
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: auto-shop-platform
data:
  # Ambiente e Servidor
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
  ALLOWED_ORIGINS: "https://autoshop.local"

  # Hostnames e Portas de Infraestrutura (Sem credenciais)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "autoshop_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # Configurações do SMTP (Hosts e portas públicas/internas)
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  EMAIL_FROM_ADDRESS: "no-reply@autoshop.com"
