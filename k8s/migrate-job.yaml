# Run Alembic once per release. Do not leave `alembic upgrade` in the API
# container command: HPA/replicas would race on the same DDL (issue #47).
#
# Re-apply after a new image:
#   kubectl delete job auto-shop-migrate -n auto-shop --ignore-not-found
#   kubectl apply -f k8s/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: auto-shop-migrate
  namespace: auto-shop
  labels:
    app.kubernetes.io/name: auto-shop-system
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: auto-shop-platform
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: auto-shop-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alembic
        image: auto-shop-system:1.0.0
        imagePullPolicy: IfNotPresent
        command: ["alembic", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: auto-shop-config
        - secretRef:
            name: auto-shop-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
