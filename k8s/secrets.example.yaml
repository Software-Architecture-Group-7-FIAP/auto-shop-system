# Copy to k8s/secrets.yaml (gitignored) and fill real values before apply:
#   cp k8s/secrets.example.yaml k8s/secrets.yaml
#   kubectl apply -f k8s/secrets.yaml
#
# Generate SECRET_KEY with: openssl rand -hex 32
# DATABASE_URL must include the password; do not put it in the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: auto-shop-secrets
  namespace: auto-shop
  labels:
    app.kubernetes.io/name: auto-shop-system
    app.kubernetes.io/part-of: auto-shop-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://seu_usuario:sua_senha_segura@postgres-service:5432/autoshop_db"
  DB_PASSWORD: "sua_senha_segura_aqui"
  SECRET_KEY: "substitua-por-openssl-rand-hex-32-nunca-reutilizar"
  INVERTEXTO_API_TOKEN: "seu_token_invertexto_aqui"
  INVERTEXTO_TOKEN: "seu_token_invertexto_aqui"
  SMTP_PASSWORD: "sua_senha_smtp_aqui"
