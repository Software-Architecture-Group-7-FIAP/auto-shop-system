# Documentation-only example. Do not apply this file as-is and never commit
# a Secret containing real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: auto-shop-secrets
  namespace: auto-shop
type: Opaque
stringData:
  DATABASE_URL: postgresql://<db-user>:<db-password>@<db-host>:5432/<db-name>
  DB_NAME: <db-name>
  DB_USER: <db-user>
  DB_PASSWORD: <replace-with-a-local-password>
  SECRET_KEY: <replace-with-at-least-32-random-characters>
  INVERTEXTO_API_TOKEN: <replace-with-provider-token>
  SMTP_USER: <optional-smtp-user>
  SMTP_PASSWORD: <optional-smtp-password>
