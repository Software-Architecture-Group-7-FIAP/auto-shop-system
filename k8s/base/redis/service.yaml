apiVersion: v1
kind: Service
metadata:
  name: auto-shop-redis
  namespace: auto-shop
  labels:
    app: auto-shop-redis
    app.kubernetes.io/name: auto-shop-system
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app: auto-shop-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
