apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-shop-config
  namespace: auto-shop
  labels:
    app.kubernetes.io/name: auto-shop-system
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: auto-shop-platform
data:
  APP_ENV: "production"
  APP_BASE_URL: "https://api.autoshop.com"
  FRONTEND_PUBLIC_URL: "https://app.autoshop.com"
  CORS_ALLOWED_ORIGINS: "https://app.autoshop.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Authorization,Content-Type"
  CORS_ALLOW_CREDENTIALS: "true"
  SECURITY_HSTS_ENABLED: "true"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  BUDGET_APPROVAL_TOKEN_EXPIRE_HOURS: "72"
  SMTP_HOST: "smtp.relay.internal"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@autoshop.com"
  SMTP_USE_TLS: "false"
  SMTP_STARTTLS: "true"
  SMTP_REQUIRE_TLS: "true"
  AUTO_CREATE_SCHEMA: "false"
  SKIP_CPF_EXTERNAL_VALIDATION: "false"
