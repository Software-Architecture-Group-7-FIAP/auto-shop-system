apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-shop-config
  namespace: auto-shop
data:
  API_ROOT_PATH: "/prd"
  AWS_REGION: "us-east-1"
  MIGRATION_DATABASE_NAME: "autoshop_prd"
  MIGRATION_DATABASE_SECRET_ARN: "__MIGRATION_DATABASE_SECRET_ARN__"
  APP_BASE_URL: "https://api.oficina-workshop.com.br/prd"
  FRONTEND_PUBLIC_URL: "https://app.oficina-workshop.com.br"
  CORS_ALLOWED_ORIGINS: "https://app.oficina-workshop.com.br"
  CORS_ALLOWED_HEADERS: "Authorization,Content-Type,Accept,X-CSRF-Token,X-Request-ID,X-Correlation-ID"
  CORS_ALLOW_CREDENTIALS: "true"
  CUSTOMER_JWT_JWKS_URL: "https://api.oficina-workshop.com.br/prd/.well-known/jwks.json"
  CUSTOMER_JWT_ISSUER: "https://api.oficina-workshop.com.br"
  CUSTOMER_JWT_AUDIENCE: "auto-shop-api"
