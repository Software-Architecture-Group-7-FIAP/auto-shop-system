apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auto-shop-prd
resources:
  - ../../../base/seed
images:
  - name: auto-shop-system
    newName: registry.example.com/auto-shop-system
    newTag: __IMAGE_TAG__
patches:
  - target:
      kind: Job
      name: auto-shop-seed
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: prd
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: prd
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "__ALLOW_SYNTHETIC_SEED_IN_PRD__"
