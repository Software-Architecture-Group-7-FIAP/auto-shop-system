apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auto-shop-api
  namespace: auto-shop
spec:
  ingressClassName: alb
  rules:
    - host: api.autoshop.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auto-shop-backend
                port:
                  number: 8000
  tls:
    - hosts:
        - api.autoshop.com
      secretName: auto-shop-tls-cert
