apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-shop-config
  namespace: auto-shop
data:
  APP_ENV: "staging"
  APP_BASE_URL: "https://staging-api.autoshop.com"
  FRONTEND_PUBLIC_URL: "https://staging.autoshop.com"
  CORS_ALLOWED_ORIGINS: "https://staging.autoshop.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Authorization,Content-Type,X-CSRF-Token,X-Request-ID,X-Correlation-ID,Accept"
  SECURITY_HSTS_ENABLED: "true"
  SMTP_HOST: "smtp.staging.autoshop.com"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@staging.autoshop.com"
  SMTP_USE_TLS: "false"
  SMTP_STARTTLS: "true"
  SMTP_REQUIRE_TLS: "true"
  CUSTOMER_JWT_JWKS_URL: "https://auth.staging.autoshop.com/.well-known/jwks.json"
  CUSTOMER_JWT_ISSUER: "https://auth.staging.autoshop.com"
  CUSTOMER_JWT_AUDIENCE: "auto-shop-api"
  CUSTOMER_JWT_CLOCK_SKEW_SECONDS: "0"
  CUSTOMER_JWT_JWKS_TIMEOUT_SECONDS: "2"
  CUSTOMER_JWT_JWKS_CACHE_SECONDS: "300"
  SERVICE_ORDER_EVENT_BUS_NAME: "auto-shop-service-orders-staging"
