apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-shop-config
  namespace: auto-shop
data:
  APP_ENV: "staging"
  AWS_REGION: "us-east-1"
  MIGRATION_DATABASE_NAME: "autoshop_hml"
  MIGRATION_DATABASE_SECRET_ARN: "__MIGRATION_DATABASE_SECRET_ARN__"
  API_ROOT_PATH: "/hml"
  APP_BASE_URL: "https://api.oficina-workshop.com.br/hml"
  FRONTEND_PUBLIC_URL: "https://app-hml.oficina-workshop.com.br"
  CORS_ALLOWED_ORIGINS: "https://app-hml.oficina-workshop.com.br"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Authorization,Content-Type,Accept,X-CSRF-Token,X-Request-ID,X-Correlation-ID"
  SECURITY_HSTS_ENABLED: "true"
  SMTP_HOST: "smtp.staging.autoshop.com"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@staging.autoshop.com"
  SMTP_USE_TLS: "false"
  SMTP_STARTTLS: "true"
  SMTP_REQUIRE_TLS: "true"
  CUSTOMER_JWT_JWKS_URL: "https://api.oficina-workshop.com.br/hml/.well-known/jwks.json"
  CUSTOMER_JWT_ISSUER: "https://api.oficina-workshop.com.br"
  CUSTOMER_JWT_AUDIENCE: "auto-shop-api"
  CUSTOMER_JWT_CLOCK_SKEW_SECONDS: "0"
  CUSTOMER_JWT_JWKS_TIMEOUT_SECONDS: "2"
  CUSTOMER_JWT_JWKS_CACHE_SECONDS: "300"
  SERVICE_ORDER_EVENT_BUS_NAME: "auto-shop-service-orders-staging"
