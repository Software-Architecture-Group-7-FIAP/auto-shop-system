apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-shop-config
  namespace: auto-shop
data:
  APP_ENV: "staging"
  APP_BASE_URL: "https://staging-api.autoshop.com"
  FRONTEND_PUBLIC_URL: "https://staging.autoshop.com"
  CORS_ALLOWED_ORIGINS: "https://staging.autoshop.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Authorization,Content-Type"
  SECURITY_HSTS_ENABLED: "true"
  SMTP_HOST: "smtp.staging.autoshop.com"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@staging.autoshop.com"
  SMTP_USE_TLS: "false"
  SMTP_STARTTLS: "true"
  SMTP_REQUIRE_TLS: "true"
