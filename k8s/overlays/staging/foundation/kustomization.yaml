apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auto-shop-hml
resources:
  - ../../../base/foundation
patches:
  - path: configmap-patch.yaml
  - path: backend-service-account-patch.yaml
  - target:
      version: v1
      kind: Namespace
      name: auto-shop
    path: namespace-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-dns
    patch: |-
      - op: replace
        path: /spec/egress
        value:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
