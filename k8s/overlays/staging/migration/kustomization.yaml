apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auto-shop-hml
resources:
  - ../../../base/migration
images:
  - name: auto-shop-system
    newName: registry.example.com/auto-shop-system
    newTag: __IMAGE_TAG__
patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: auto-shop-migrate
    patch: |-
      - op: replace
        path: /spec/backoffLimit
        value: 0
      - op: replace
        path: /spec/template/spec/restartPolicy
        value: Never
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: MIGRATION_DIAGNOSTICS
            value: "true"
