apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auto-shop-ingress
  namespace: auto-shop
spec:
  ingressClassName: nginx
  rules:
  - host: api.autoshop.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auto-shop-backend-service
            port:
              number: 80
  - host: www.api.autoshop.com 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auto-shop-backend-service
            port:
              number: 80